bundle:
  name: dab_training

variables:
  env_name:
    default: dev-test

resources:
  jobs:
    hello_job:
      name: hello_job_${bundle.target}
      parameters:
        - name: run_date
          default: "2026-10-29"
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
      tasks:
        - task_key: run_script
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ./hello_job.py
            parameters:
              - "--env"
              - ${var.env_name}
              - "--run_date"
              - "{{job.parameters.run_date}}"

targets:
  dev-test:
    mode: development
    default: true
    workspace:
      host: https://adb-4161923938338403.3.azuredatabricks.net
    variables:
      env_name: dev-test

  prod-test:
    mode: production
    workspace:
      host: https://adb-4161923938338403.3.azuredatabricks.net
      root_path: /Workspace/Users/fresonr@illuminationworksllc.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      env_name: prod-test